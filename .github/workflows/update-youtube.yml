name: Update Latest YouTube Video

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install yt-dlp
        run: pip install yt-dlp

       - name: Update latest video
        run: |
          yt-dlp \
            --flat-playlist \
            --playlist-end 1 \
            --print-json \
            "https://www.youtube.com/channel/UC4FqgUr66G2QfUGKey8iI6w/videos" \
            > video.json

          python - <<'PY'
          import json

          with open("video.json", "r", encoding="utf-8") as f:
              video = json.loads(f.readline())

          video_id = video["id"]
          title = video["title"]

          data = {
              "title": title,
              "videoId": video_id,
              "thumbnail": f"https://i.ytimg.com/vi/{video_id}/maxresdefault.jpg",
              "url": f"https://www.youtube.com/watch?v={video_id}"
          }

          with open("public/latest-video.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/latest-video.json

          if git diff --cached --quiet; then
            echo "No new video found."
          else
            git commit -m "Update latest YouTube video"
            git push
          fi
